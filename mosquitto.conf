# Configuracao minima do broker Mosquitto para a maquete.
# Serve para Linux, macOS, Raspberry Pi e Windows:
#     mosquitto -c mosquitto.conf -v
#
# Sem estas linhas, o Mosquitto 2.x aceita conexoes so do proprio computador,
# e as placas recebem "conexao recusada".

# aceita conexoes de qualquer aparelho da rede local, na porta padrao
listener 1883 0.0.0.0
# rede local de laboratorio, sem usuario e senha (veja a secao de seguranca do README)
allow_anonymous true

# sem persistencia: as placas republicam o proprio estado ao conectar
persistence false
connection_messages true
log_timestamp true
